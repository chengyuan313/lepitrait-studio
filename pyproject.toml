[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurolepi-id"
version = "1.0.0"
description = "Training and inference toolkit for image-based European butterfly identification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EuroLepi ID contributors"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "PyYAML>=6.0",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
eurolepi = "eurolepi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
