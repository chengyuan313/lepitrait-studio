[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lepitrait-studio"
version = "0.2.0"
description = "A GUI-first workflow for standardized Lepidoptera specimen digitization and trait extraction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LepiTrait Studio contributors"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "pydantic>=2.6",
  "scipy>=1.11",
  "streamlit>=1.40",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
ml = ["torch>=2.2", "open-clip-torch>=2.26", "timm>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lepitrait = "lepitrait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
